name: securitymasker-chatgpt

x-image: &securitymasker-image
  image: securitymasker-windows-spike:0.1.0
  build:
    context: ..
    dockerfile: docker/Dockerfile

x-hardening: &securitymasker-hardening
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  init: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1700,uid=10001,gid=10001

services:
  model-setup:
    <<: [*securitymasker-image, *securitymasker-hardening]
    profiles:
      - setup
    command:
      - model-load
      - --model
      - tsmatz/xlm-roberta-ner-japanese
      - --revision
      - aba094e118d5ffc622e9b25e07edc49f9dd85feb
    environment:
      HF_HOME: /var/lib/securitymasker-model
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - type: volume
        source: model-cache
        target: /var/lib/securitymasker-model
    mem_limit: 6g
    cpus: 4.0
    restart: "no"

  init:
    <<: [*securitymasker-image, *securitymasker-hardening]
    profiles:
      - setup
    command:
      - init
      - --directory
      - /var/lib/securitymasker-product
      - --mode
      - chatgpt
      - --port
      - "4000"
    network_mode: none
    volumes:
      - type: volume
        source: product-data
        target: /var/lib/securitymasker-product
    mem_limit: 512m
    cpus: 1.0
    restart: "no"

  gateway:
    <<: [*securitymasker-image, *securitymasker-hardening]
    command:
      - gateway
      - --config
      - /var/lib/securitymasker-product/securitymasker.config
    environment:
      HF_HOME: /var/lib/securitymasker-model
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_OFFLINE: "1"
      DO_NOT_TRACK: "1"
    network_mode: host
    volumes:
      - type: volume
        source: product-data
        target: /var/lib/securitymasker-product
      - type: volume
        source: model-cache
        target: /var/lib/securitymasker-model
        read_only: true
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:4000/ready", timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    mem_limit: 6g
    cpus: 4.0
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  model-cache:
  product-data:
