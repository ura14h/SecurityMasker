name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (pinned, lightweight — no LiteLLM)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy --strict)
        run: mypy

      - name: Unit + evaluation tests
        run: pytest tests/unit tests/evaluation -q

      - name: Live gateway integration (proxy + mock upstream)
        run: SM_RUN_LIVE=1 pytest tests/integration/test_live_gateway.py -q
