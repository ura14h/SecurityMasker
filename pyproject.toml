[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "securitymasker"
version = "0.0.1"
description = "Reversible pseudonymization security boundary (transparent proxy for Codex / Claude Code)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "SecurityMasker maintainers" }]
keywords = ["pii", "masking", "security", "llm-proxy", "presidio", "pseudonymization"]

# The gateway is a purpose-built Starlette + httpx transparent proxy (ADR-0006);
# there is no LiteLLM dependency. Runtime deps are range-pinned here and exactly
# pinned in requirements.lock, which CI and Docker install from for reproducible
# builds (see docs/compatibility.md).
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "cryptography>=42,<49",
    "httpx>=0.27,<0.30",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "structlog>=24.1,<26",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
# Presidio-based detection (in-process). Pulls spaCy; JA model installed separately.
presidio = [
    "presidio-analyzer>=2.2.355,<3",
]
# Japanese NER for UNREGISTERED names/orgs/places (ADR-0009). Optional and OFF by
# default: the dictionary and deterministic detectors are the trusted layer, and
# this only widens recall. Pulls torch, so it is never a runtime dependency.
ner = [
    "transformers>=4.40,<5",
    "torch>=2.2,<3",
    "sentencepiece>=0.2,<1",
]
# Redis-backed session store (Phase 5).
redis = [
    "redis>=5.0,<9",
]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<0.25",
    "hypothesis>=6.100,<7",
    "ruff>=0.5,<0.9",
    "mypy>=1.10,<2",
    "respx>=0.21,<0.23",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
securitymasker = "securitymasker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Test data / fixture strings are naturally long.
"tests/**/*.py" = ["E501"]
# Mock upstream emits inline JSON SSE lines that are naturally long.
"devtools/mock_upstream.py" = ["E501"]
# Secret-pattern table rows are naturally long (regex + metadata on one line).
"src/securitymasker/detectors/secret_patterns.py" = ["E501"]
# Entity/label mapping tables are naturally long (tuple rows on one line).
"src/securitymasker/detectors/presidio.py" = ["E501"]
"src/securitymasker/detectors/japanese_ner.py" = ["E501"]
"src/securitymasker/detectors/formats.py" = ["E501"]
# Proxy log handle is intentionally held open for the fixture lifetime.
"tests/integration/test_live_proxy.py" = ["SIM115"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["securitymasker"]
mypy_path = "src"

# Optional, import-guarded ML dependencies (presidio / transformers): the detectors
# no-op when they are absent, so their missing stubs must not fail type-checking.
[[tool.mypy.overrides]]
module = ["presidio_analyzer", "presidio_analyzer.*", "transformers", "transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
