[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "securitymasker"
version = "1.0.0"
description = "Reversible pseudonymization security boundary (transparent proxy for Codex / Claude Code)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SecurityMasker maintainers" }]
keywords = ["pii", "masking", "security", "llm-proxy", "pseudonymization"]

# The gateway is a purpose-built Starlette + httpx transparent proxy (ADR-0006);
# there is no LiteLLM dependency. Runtime deps are range-pinned here and exactly
# pinned in requirements.lock for reproducible source setup.
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "cryptography>=42,<49",
    "httpx>=0.27,<0.30",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "websockets>=17,<18",
    "structlog>=24.1,<26",
    "PyYAML>=6.0,<7",
    "transformers>=4.40,<5",
    "torch>=2.2,<3",
    "sentencepiece>=0.2,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<0.25",
    "hypothesis>=6.100,<7",
    "ruff>=0.5,<0.9",
    "mypy>=1.10,<2",
    "respx>=0.21,<0.23",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
securitymasker = "securitymasker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
securitymasker = ["resources/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Test data / fixture strings are naturally long.
"tests/**/*.py" = ["E501"]
# Mock upstream emits inline JSON SSE lines that are naturally long.
"devtools/mock_upstream.py" = ["E501"]
# Secret-pattern table rows are naturally long (regex + metadata on one line).
"src/securitymasker/detectors/secret_patterns.py" = ["E501"]
# Entity/label mapping tables are naturally long (tuple rows on one line).
"src/securitymasker/detectors/japanese_ner.py" = ["E501"]
"src/securitymasker/detectors/formats.py" = ["E501"]
# Proxy log handle is intentionally held open for the fixture lifetime.
"tests/integration/test_live_gateway.py" = ["SIM115"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["securitymasker"]
mypy_path = "src"

# transformers ships incomplete type information for its dynamic factories.
[[tool.mypy.overrides]]
module = ["transformers", "transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
