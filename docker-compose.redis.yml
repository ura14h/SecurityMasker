# Redis session-store overlay. Apply ON TOP of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.redis.yml \
#     --profile redis up
#
# Kept separate so the default (memory) setup carries no Redis URL and no
# master key: a base file holding secret-shaped values it never reads invites
# someone to treat the demo key as configuration.
services:
  gateway:
    depends_on:
      - redis
    environment:
      SECURITYMASKER_STORE: redis
      SECURITYMASKER_REDIS_URL: "${SECURITYMASKER_REDIS_URL:-redis://redis:6379/0}"
      # DEMO KEY — 32 bytes, valid but public. Generate your own with
      # `openssl rand -base64 32` and inject it from a secret store; never reuse
      # this one anywhere real.
      SECURITYMASKER_MASTER_KEY: "${SECURITYMASKER_MASTER_KEY:-c2VjdXJpdHltYXNrZXItZGVtby1rZXktMzJieXRlcyE=}"
