# Exact lock for the OPTIONAL Japanese NER extra (ADR-0009/0010).
# COMPLETE transitive closure of transformers/torch/sentencepiece, computed
# from installed metadata rather than a hand-written name filter — which is
# how huggingface-hub (a hard transformers dependency) went missing before.
# Packages already pinned by requirements.lock are omitted: the ner stage
# layers on top of it, so repeating them would create two sources of truth.
#
#   pip install -r requirements.lock -r requirements-ner.lock
#
# The ner Docker stage installs this with --no-deps, so anything missing here
# fails the build rather than being resolved dynamically at build time.
