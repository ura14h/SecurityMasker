# LiteLLM config for the Phase 0 live integration test. Routes to the mock
# upstream on 127.0.0.1:8081 so no real provider is contacted. The no-op
# SecurityMasker guardrail is registered to prove it loads on the hook path.
model_list:
  - model_name: securitymasker-openai
    litellm_params:
      model: openai/gpt-4o
      api_base: http://127.0.0.1:8081
      api_key: sk-mock-not-a-real-key

  - model_name: securitymasker-anthropic
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_base: http://127.0.0.1:8081
      api_key: sk-ant-mock-not-a-real-key

guardrails:
  - guardrail_name: securitymasker
    litellm_params:
      # Resolved as tests/integration/securitymasker_guardrail.py (see shim).
      guardrail: securitymasker_guardrail.SecurityMaskerCallback
      mode: pre_call
      default_on: true

litellm_settings:
  set_verbose: false
