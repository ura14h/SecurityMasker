# LiteLLM config for the Phase 2 live masking test (mock upstream on :8082).
# Registered as a callback (not a mode-gated guardrail) so the full mask+restore
# lifecycle fires: pre_call (mask), post_call_success (restore), streaming iterator.
model_list:
  - model_name: securitymasker-openai
    litellm_params:
      model: openai/gpt-4o
      api_base: http://127.0.0.1:8082
      api_key: sk-mock-not-a-real-key
litellm_settings:
  set_verbose: false
  callbacks: ["securitymasker_guardrail.securitymasker_callback"]
