# SecurityMasker starter dictionary. All values are synthetic.
# Replace them with your own entries, but never commit real secrets:
# use value_from_env for API keys, passwords and private keys.
version: 1

defaults:
  fail_mode: closed
  normalization: nfkc
  merge_surface_forms: false
  preserve_aliases: true
  session_idle_ttl: 4h
  session_absolute_ttl: 24h
  inject_alias_instruction: true

entities:
  - id: example_company
    type: ORGANIZATION
    values:
      - 株式会社極秘技研
      - 極秘技研
    replacement_profile: prose_identifier
    restore_policy: literal
    priority: 100

  - id: example_person
    type: PERSON
    values:
      - 山田太郎
      - 山田 太郎
      - Taro Yamada
    replacement_profile: prose_identifier
    restore_policy: literal
    priority: 100

patterns:
  - id: example_ticket
    pattern: 'INC-[0-9]{6}'
    type: CUSTOMER_ID
    replacement_profile: numeric
    restore_policy: literal
    priority: 120

enable_secret_detector: true
enable_format_detectors: true

japanese_pii:
  enabled: true
  my_number_restore_policy: block

ner:
  model: null
