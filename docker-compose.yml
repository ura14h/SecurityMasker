# Local demo: `docker compose up` starts the SecurityMasker proxy in front of a
# mock upstream (no real API keys), plus optional Redis.
#
# Try it (Responses API):
#   curl http://127.0.0.1:4000/responses \
#     -H 'Content-Type: application/json' -H 'X-SecurityMasker-Session-ID: demo' \
#     -d '{"model":"m","input":"担当は山田太郎、株式会社極秘技研の件です"}'
services:
  mock-upstream:
    # The mock lives only in the `demo` image stage, never in the production image.
    build:
      context: .
      target: demo
    command: python -m uvicorn devtools.mock_upstream:app --host 0.0.0.0 --port 8081
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  gateway:
    # Production `runtime` stage (no mock/test code in the image, doc/06 P2-3).
    build:
      context: .
      target: runtime
    depends_on:
      - mock-upstream
    environment:
      # A demo-specific dictionary with no env-backed entries, so this file needs
      # no secret-shaped variables at all (the production template is
      # config/securitymasker.example.yaml).
      SECURITYMASKER_CONFIG: config/securitymasker.demo.yaml
      # Point the upstreams at the in-compose mock (swap for real providers /
      # https://chatgpt.com/backend-api/codex / https://api.anthropic.com).
      SECURITYMASKER_OPENAI_UPSTREAM: http://mock-upstream:8081
      SECURITYMASKER_ANTHROPIC_UPSTREAM: http://mock-upstream:8081
      # A container must bind 0.0.0.0 to be reachable; the publish mapping below
      # keeps it on loopback. Acknowledged HERE (not baked into the image) so a
      # bare `docker run -p 4000:4000` still hits the guard (doc/06 P0-9).
      SECURITYMASKER_ALLOW_PUBLIC_BIND: "1"
      # NOTE: no store configuration here. This file runs the default in-memory
      # store, so a Redis URL and a master key would be values it never reads —
      # and a base file carrying key material invites someone to treat the demo
      # key as configuration. Redis lives in docker-compose.redis.yml.
    ports:
      - "127.0.0.1:4000:4000"   # keep the admin/proxy surface on localhost (§33)
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # Optional shared session store for multi-worker deployments (§8). Redis needs
  # a URL and a master key on the GATEWAY too, so that configuration lives in
  # docker-compose.redis.yml rather than here — the default memory setup should
  # not carry secret-shaped variables it never reads. Enable with:
  #   docker compose -f docker-compose.yml -f docker-compose.redis.yml --profile redis up
  redis:
    # Pinned by digest (multi-arch index) — see docs/operations.md.
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    profiles: ["redis"]
    read_only: true
    tmpfs:
      - /data
    security_opt:
      - no-new-privileges:true
