# Local demo: `docker compose up` starts the SecurityMasker proxy in front of a
# mock upstream (no real API keys), plus optional Redis.
#
# Try it (Responses API):
#   curl http://127.0.0.1:4000/responses \
#     -H 'Content-Type: application/json' -H 'X-SecurityMasker-Session-ID: demo' \
#     -d '{"model":"m","input":"担当は山田太郎、株式会社極秘技研の件です"}'
services:
  mock-upstream:
    # The mock lives only in the `demo` image stage, never in the production image.
    build:
      context: .
      target: demo
    command: python -m uvicorn tests.integration.mock_upstream:app --host 0.0.0.0 --port 8081
    environment:
      SM_MOCK_RECORD: /tmp/mock_record.jsonl
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  gateway:
    # Production `runtime` stage (no mock/test code in the image, doc/06 P2-3).
    build:
      context: .
      target: runtime
    depends_on:
      - mock-upstream
    environment:
      SECURITYMASKER_CONFIG: config/securitymasker.example.yaml
      # The example config declares these via `value_from_env`, and a missing
      # env var now fails startup (doc/06 P0-6). Synthetic demo values only —
      # replace with real ones (from a secret store) outside the demo.
      PROD_DB_HOST: demo-db01.internal.invalid
      INTERNAL_API_KEY: sk-demo-0000000000000000000000000
      # Point the upstreams at the in-compose mock (swap for real providers /
      # https://chatgpt.com/backend-api/codex / https://api.anthropic.com).
      SECURITYMASKER_OPENAI_UPSTREAM: http://mock-upstream:8081
      SECURITYMASKER_ANTHROPIC_UPSTREAM: http://mock-upstream:8081
      # A container must bind 0.0.0.0 to be reachable; the publish mapping below
      # keeps it on loopback. Acknowledged HERE (not baked into the image) so a
      # bare `docker run -p 4000:4000` still hits the guard (doc/06 P0-9).
      SECURITYMASKER_ALLOW_PUBLIC_BIND: "1"
      # Shared session store. Only takes effect with `--profile redis`; without it
      # the gateway would fail closed at startup, so both are set together below.
      SECURITYMASKER_STORE: "${SECURITYMASKER_STORE:-memory}"
      SECURITYMASKER_REDIS_URL: "${SECURITYMASKER_REDIS_URL:-redis://redis:6379/0}"
      # Seals sessions at rest in Redis. Demo-only value — generate a real one
      # (`openssl rand -base64 32`) and inject it from a secret store.
      SECURITYMASKER_MASTER_KEY: "${SECURITYMASKER_MASTER_KEY:-c2VjdXJpdHltYXNrZXItZGVtby1rZXktMzJieXRlcyE=}"
    ports:
      - "127.0.0.1:4000:4000"   # keep the admin/proxy surface on localhost (§33)
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # Optional shared session store for multi-worker deployments (§8). Enable with:
  #   SECURITYMASKER_STORE=redis docker compose --profile redis up
  # (the gateway needs SECURITYMASKER_STORE set too — starting Redis alone does
  # not switch the store, and a half-configured store fails closed.)
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    profiles: ["redis"]
    read_only: true
    tmpfs:
      - /data
    security_opt:
      - no-new-privileges:true
