# LiteLLM Proxy config example — registers SecurityMasker as a CALLBACK so the full
# mask (pre_call) + restore (post_call / streaming) lifecycle runs.
# Verified against litellm==1.93.0 (see docs/compatibility.md).
#
# Point SECURITYMASKER_CONFIG at your dictionary YAML before starting the proxy:
#   export SECURITYMASKER_CONFIG=config/securitymasker.example.yaml
#   litellm --config config/litellm.example.yaml
# If SECURITYMASKER_CONFIG is unset, SecurityMasker is a transparent no-op.
#
# Secrets/keys come from the environment — never hardcode them here (§25).

model_list:
  # Codex / OpenAI Responses API path.
  - model_name: securitymasker-openai
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  # Claude Code / Anthropic Messages API path.
  - model_name: securitymasker-anthropic
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  # §25: do not enable verbose/raw-request logging in production.
  set_verbose: false
  # LiteLLM resolves this dotted path as a file relative to THIS config's directory,
  # so it points at config/securitymasker_guardrail.py — a shim exposing a pre-built
  # SecurityMaskerCallback instance (the callbacks path uses the object directly, not
  # the class). See docs/compatibility.md.
  callbacks: ["securitymasker_guardrail.securitymasker_callback"]
  # External log integrations (e.g. langfuse) are intentionally omitted until
  # raw-request non-forwarding is verified (docs/compatibility.md open item).

general_settings:
  # Keep the admin/management surface off any public interface (§33).
  # master_key: os.environ/LITELLM_MASTER_KEY
