# SecurityMasker dictionary + policy config (§12). Load via SECURITYMASKER_CONFIG
# or --config. Do NOT commit real secrets here — pull those from the environment
# with `value_from_env` (§25). The synthetic values below are safe examples.
version: 1

defaults:
  fail_mode: closed            # fail-closed on any error (§26)
  normalization: nfkc          # detection normalization; restore keeps original form
  merge_surface_forms: false   # per-surface-form aliases (user decision)
  preserve_aliases: true       # do not re-mask existing SM_ aliases (§11)
  session_idle_ttl: 4h
  session_absolute_ttl: 24h
  inject_alias_instruction: true

entities:
  - id: customer_company
    type: ORGANIZATION
    values:
      - 株式会社極秘技研
      - 極秘技研
      - 極秘技研株式会社
    replacement_profile: prose_identifier
    restore_policy: literal
    priority: 100

  - id: employee_yamada
    type: PERSON
    values:
      - 山田太郎
      - 山田 太郎
      - Taro Yamada
    replacement_profile: prose_identifier
    restore_policy: literal
    priority: 100

  - id: production_hostname
    type: HOSTNAME
    # Real hostname comes from the environment, never committed here.
    value_from_env: PROD_DB_HOST
    replacement_profile: hostname
    restore_policy: literal
    priority: 100

  - id: internal_api_key
    type: API_KEY
    value_from_env: INTERNAL_API_KEY
    replacement_profile: environment_reference
    restore_policy: env_reference
    priority: 200

  - id: internal_project
    type: PROJECT_NAME
    values:
      - 桜計画
      - Project Sakura
    replacement_profile: prose_identifier
    restore_policy: literal

patterns:
  - id: internal_ticket
    pattern: 'INC-[0-9]{6}'
    type: CUSTOMER_ID
    replacement_profile: numeric
    restore_policy: literal
    priority: 120

# Built-in developer-secret detector (API keys, JWT, PEM, DB URLs, ...).
enable_secret_detector: true
# Built-in format recognizers (email, IPv4, credit card with Luhn).
enable_format_detectors: true

# Japanese PII recognizers (phone, postal, My Number, address, date of birth).
japanese_pii:
  enabled: true
  my_number_restore_policy: block   # マイナンバーは既定でブロック（§10）

# Legacy v1 example. The v2 starter created by `securitymasker init` enables the
# pinned Japanese NER model by default.
ner:
  model: null
  min_score: 0.85
